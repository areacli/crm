# nginx do CRM em Laravel: entrega os estáticos e passa o resto ao PHP-FPM. O nginx do servidor (TLS, cabeçalhos,
# limite de tentativas de login) fica na frente, como na demonstração.
server {
    listen 8080;
    server_name _;
    root /app/public;
    index index.php;

    client_max_body_size 2m;
    server_tokens off;

    # O nginx resolveria `app` uma vez, na subida: depois de recriar o contêiner da aplicação (atualização), o endereço
    # muda e o site daria 502 até reiniciar o nginx. Com o resolvedor do Docker e uma variável, o nome é resolvido a cada uso.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $php_upstream app:9000;

    # O Livewire 4 monta a rota com um prefixo que varia com a chave da aplicação: /livewire-<hash>/upload-file.
    location ~ ^/livewire[^/]*/upload-file$ {
        # Só o envio de planilha aceita arquivo grande (50 MB e uma folga de cabeçalho).
        client_max_body_size 51m;
        client_body_timeout 300s;
        fastcgi_read_timeout 300s;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass $php_upstream;
    }

    location /build/ { expires 365d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location ~ ^/(css|js|fonts)/ { expires 7d; try_files $uri =404; }

    location / { try_files $uri /index.php?$query_string; }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass $php_upstream;
        fastcgi_read_timeout 90s;
    }

    # Nada além de index.php executa PHP; arquivos ocultos e de configuração não saem.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
