; Ajustes de PHP do CRM (decisão 0013). Envio de planilha até 50 MB (especificação 01): o limite do PHP vem junto
; com o do nginx (só na rota de envio) e o do Livewire (config/livewire.php).
upload_max_filesize = 50M
post_max_size = 55M
max_file_uploads = 5
memory_limit = 256M
max_execution_time = 60
expose_php = Off
date.timezone = America/Sao_Paulo

; O código da imagem não muda em execução: sem checar a data dos arquivos a cada requisição.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
