# Tarefas agendadas (sidekiq-cron lê este arquivo ao subir o Sidekiq). A hora é a de Brasília (config.time_zone).
data_retention:
  cron: "0 3 * * *"
  class: "RetentionDispatchJob"
  queue: default
  active_job: true
  description: "Guarda de dados (07): enfileira a anonimização por prazo de cada credor"

fetch_indexes:
  cron: "0 5 * * *"
  class: "FetchIndexesJob"
  queue: default
  active_job: true
  description: "Índices do Banco Central (08): busca global das quatro séries"

segments_recalculation:
  cron: "30 5 * * *"
  class: "SegmentsDispatchJob"
  queue: default
  active_job: true
  description: "Segmentos (08): enfileira o recálculo dos contratos de cada credor"
