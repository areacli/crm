# Tarefas agendadas (sidekiq-cron lê este arquivo ao subir o Sidekiq). A hora é a de Brasília (config.time_zone).
data_retention:
  cron: "0 3 * * *"
  class: "RetentionDispatchJob"
  queue: default
  active_job: true
  description: "Guarda de dados (07): enfileira a anonimização por prazo de cada credor"

fetch_indexes:
  cron: "0 5 * * *"
  class: "FetchIndexesJob"
  queue: default
  active_job: true
  description: "Índices do Banco Central (08): busca global das quatro séries"

segments_recalculation:
  cron: "30 5 * * *"
  class: "SegmentsDispatchJob"
  queue: default
  active_job: true
  description: "Segmentos (08): enfileira o recálculo dos contratos de cada credor"

promises_daily:
  cron: "50 6 * * *"
  class: "PromisesDispatchJob"
  queue: default
  active_job: true
  description: "Promessas (10): quebra as abertas com prazo vencido e encerra as pendentes sem aprovação"

agreements_daily:
  cron: "55 6 * * *"
  class: "AgreementsDispatchJob"
  queue: default
  active_job: true
  description: "Acordos (11): expira as propostas, quebra os acordos em atraso (R234), reavalia os ativos e gera o arquivo do dia"

payment_accounts_daily:
  cron: "0 7 * * *"
  class: "PaymentAccountsDailyJob"
  queue: default
  active_job: true
  description: "Contas de pagamento (12): avisa os certificados que vencem em 30 dias ou menos"

payment_reconciliation:
  cron: "20 7 * * *"
  class: "PaymentReconciliationDispatchJob"
  queue: default
  active_job: true
  description: "Pagamentos (12): reprocessa os avisos que falharam e confere no fornecedor os instrumentos ativos sem conferência há alguns dias"
