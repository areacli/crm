        about:
          boleto: "Você autoriza na página do PagBank depois de salvar; nenhuma credencial é digitada aqui."
          pix: "Você autoriza na página do PagBank depois de salvar; nenhuma credencial é digitada aqui."
          card: "Você autoriza na página do PagBank depois de salvar; nenhuma credencial é digitada aqui. O cartão é cifrado no navegador do cliente."
