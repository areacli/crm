# Configuração por meio de pagamento (16, revisão 1, R373 a R373d) e o que cada fornecedor pede antes, por meio (12, revisão 8, R259).
pt-BR:
  payments:
    providers:
      fake:
        about:
          boleto: "Fornecedor de teste: emite sem chamar ninguém. Pede uma chave de API qualquer."
          pix: "Fornecedor de teste: emite sem chamar ninguém. Pede uma chave de API qualquer e uma chave Pix."
          card: "Fornecedor de teste: cobra sem chamar ninguém. Pede uma chave de API qualquer."
      efi:
        about:
          boleto: "Client ID e Client Secret da aplicação na conta Efí."
          pix: "Client ID e Client Secret da aplicação na Efí, o certificado .p12 da API Pix e a chave Pix cadastrada na conta."
          card: "Client ID e Client Secret da aplicação na Efí e o identificador da conta (payee_code). O cartão é tokenizado no navegador do cliente."
