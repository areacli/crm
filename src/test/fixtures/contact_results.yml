<%# A lista inicial (R68) para os dois credores dos testes, na ordem da especificação; o nome da fixture é "<credor>_<chave>". %>
<% keys = %w[call_back negotiating says_paid contests refused third_party_message third_party_unknown no_answer voicemail message_unanswered wrong_number] %>
<% %w[alfa beta].each do |tenant| %>
<% Contacts::InitialResults::LIST.each_with_index do |(name, kind, rule), index| %>
<%= tenant %>_<%= keys[index] %>:
  tenant: <%= tenant %>
  name: <%= name %>
  name_key: <%= FoldedText.fold(name) %>
  kind: <%= kind %>
  return_rule: <%= rule %>
  position: <%= index + 1 %>
  invalidates_contact: <%= name == "Número ou endereço inexistente" %>
<% end %>
<% end %>
