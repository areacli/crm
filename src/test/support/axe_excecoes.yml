# Exceções nomeadas do axe (decisão 0025, item 10): só o que vem de dentro de um controle do OpenUI5 e não tem conserto por configuração.
# Cada uma diz a regra, o controle (seletor CSS do elemento ou de um ancestral) e o motivo. Revista a cada subida de versão do OpenUI5.
- regra: label-content-name-mismatch
  controle: .sapMITBFilter
  motivo: >-
    sap.m.IconTabFilter com contagem (abas da ficha): o OpenUI5 dá à aba o nome acessível só com o texto, e a contagem fica fora dele; o
    leitor de tela lê a contagem como descrição. Sem propriedade para juntar os dois (OpenUI5 1.148).
- regra: nested-interactive
  controle: .sapMListTblRow
  motivo: >-
    sap.m.Table: a linha recebe foco (tabindex -1, navegação por setas entre as linhas) e tem link ou botão dentro (abrir a ficha, menu da
    linha). É o modelo de teclado da tabela do OpenUI5 ("Keyboard Handling for Item Navigation"); o link e o botão continuam alcançáveis pelo Tab.
- regra: nested-interactive
  controle: .sapMTabStripItem
  motivo: >-
    sap.m.TabContainer (abas da aplicação, P27): a aba é focável e tem o botão de fechar dentro. O OpenUI5 tira o botão da ordem do Tab
    (tabindex -1) e fecha a aba pela tecla Delete; o axe recusa qualquer controle dentro de outro.
- regra: aria-valid-attr-value
  controle: .sapTntNLGroup
  motivo: >-
    sap.tnt.NavigationListGroup (grupos do menu lateral): o grupo aponta `aria-owns` para a lista dos itens, que o OpenUI5 desenha com outro id
    quando o grupo é o primeiro nível do menu. O leitor de tela continua lendo os itens dentro do grupo (estrutura do próprio HTML).
